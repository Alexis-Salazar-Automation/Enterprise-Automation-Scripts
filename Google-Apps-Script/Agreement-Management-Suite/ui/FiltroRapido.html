<!DOCTYPE html>
<html>
<head>
    <base target="_top">
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <style>
        body { padding: 20px; font-family: Arial, sans-serif; }
        .paso { display: none; }
        #paso1-columna { display: block; }
        .select2-container .select2-selection--multiple { border: 1px solid #ced4da; }
        .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.8); z-index: 9999; display: flex; justify-content: center; align-items: center; }
    </style>
</head>
<body>
    <div class="container">
        <!-- PASO 1: SELECCIONAR COLUMNA -->
        <div id="paso1-columna" class="paso">
            <h4>Paso 1: Elige por qué columna filtrar</h4>
            <div class="form-group">
                <label for="columna-select">Columnas disponibles en la hoja activa:</label>
                <select id="columna-select" class="form-control"></select>
            </div>
            <button class="btn btn-primary" onclick="seleccionarColumna()">Siguiente</button>
        </div>

        <!-- PASO 2: SELECCIONAR VALORES -->
        <div id="paso2-valores" class="paso">
            <h4>Paso 2: Selecciona los valores a mostrar</h4>
            <div class="form-group">
                <label for="valores-select">Valores disponibles:</label>
                <select id="valores-select" class="form-control" multiple="multiple"></select>
            </div>
            <button class="btn btn-secondary" onclick="mostrarPaso('paso1-columna')">Regresar</button>
            <button class="btn btn-success" onclick="aplicarFiltro()">⚡ Aplicar Filtro en la Hoja</button>
        </div>
    </div>

    <div id="loading" class="loading-overlay" style="display: none;">
        <div class="spinner-border text-primary" role="status"></div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script>
        let filtro = {};

        document.addEventListener("DOMContentLoaded", () => {
            mostrarLoading(true);
            google.script.run
                .withSuccessHandler(columnas => {
                    const select = $('#columna-select');
                    select.empty().append('<option selected disabled value="">Selecciona una columna...</option>');
                    columnas.forEach(col => select.append(`<option value="${col}">${col}</option>`));
                    mostrarLoading(false);
                })
                .withFailureHandler(err => { alert(err); google.script.host.close(); })
                .obtenerColumnasDeHojaActiva(); // Nueva función de servidor
        });

        function seleccionarColumna() {
            const columna = $('#columna-select').val();
            if (!columna) { alert('Por favor, selecciona una columna.'); return; }
            filtro.columna = columna;
            mostrarLoading(true);
            google.script.run
                .withSuccessHandler(valores => {
                    $('#valores-select').empty().select2({
                        data: valores,
                        placeholder: 'Selecciona uno o más valores...'
                    });
                    mostrarPaso('paso2-valores');
                    mostrarLoading(false);
                })
                .withFailureHandler(err => { alert(err); mostrarLoading(false); })
                .obtenerValoresUnicosDeColumnaActiva(columna); // Nueva función de servidor
        }

        function aplicarFiltro() {
            const valores = $('#valores-select').val();
            if (!valores || valores.length === 0) {
                alert('Por favor, selecciona al menos un valor.'); return;
            }
            filtro.valores = valores;
            mostrarLoading(true);
            google.script.run
                .withSuccessHandler(() => google.script.host.close())
                .withFailureHandler(err => { alert(err); mostrarLoading(false); })
                .aplicarFiltroEnHoja(filtro); // Nueva función de servidor
        }

        function mostrarPaso(idPaso) {
            $('.paso').hide();
            $(`#${idPaso}`).show();
        }

        function mostrarLoading(mostrar) {
            $('#loading').toggle(mostrar);
        }
    </script>
</body>
</html>
