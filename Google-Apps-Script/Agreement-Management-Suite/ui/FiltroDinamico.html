<!DOCTYPE html>
<html>
<head>
    <base target="_top">
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <style>
        body { padding: 20px; font-family: Arial, sans-serif; }
        .paso { display: none; }
        #paso1-hoja { display: block; }
        .select2-container .select2-selection--multiple { border: 1px solid #ced4da; }
        .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.8); z-index: 9999; display: flex; justify-content: center; align-items: center; }
    </style>
</head>
<body>
    <div class="container">
        <!-- PASO 1: SELECCIONAR HOJA -->
        <div id="paso1-hoja" class="paso">
            <h4>Paso 1: Selecciona la hoja a filtrar</h4>
            <div class="list-group">
                <button type="button" class="list-group-item list-group-item-action" onclick="seleccionarHoja('Convenios Activos')">Convenios Activos</button>
                <button type="button" class="list-group-item list-group-item-action" onclick="seleccionarHoja('Concentrado')">Concentrado</button>
            </div>
        </div>

        <!-- PASO 2: SELECCIONAR COLUMNA -->
        <div id="paso2-columna" class="paso">
            <h4>Paso 2: Elige por qué columna quieres filtrar</h4>
            <div class="form-group">
                <label for="columna-select">Columnas disponibles:</label>
                <select id="columna-select" class="form-control"></select>
            </div>
            <button class="btn btn-secondary" onclick="mostrarPaso('paso1-hoja')">Regresar</button>
            <button class="btn btn-primary" onclick="seleccionarColumna()">Siguiente</button>
        </div>

        <!-- PASO 3: SELECCIONAR VALORES Y APLICAR -->
        <div id="paso3-valores" class="paso">
            <h4>Paso 3: Selecciona los valores a mostrar</h4>
            <div class="form-group">
                <label for="valores-select">Valores disponibles:</label>
                <select id="valores-select" class="form-control" multiple="multiple"></select>
            </div>
            <button class="btn btn-secondary" onclick="mostrarPaso('paso2-columna')">Regresar</button>
            <button class="btn btn-success" onclick="aplicarFiltro()">⚡ Aplicar Filtro y Mostrar</button>
        </div>
    </div>

    <div id="loading" class="loading-overlay" style="display: none;">
        <div class="spinner-border text-primary" role="status"></div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script>
        let filtro = {};

        function seleccionarHoja(nombreHoja) {
            filtro.hoja = nombreHoja;
            mostrarLoading(true);
            google.script.run
                .withSuccessHandler(columnas => {
                    const select = $('#columna-select');
                    select.empty().append('<option selected disabled value="">Selecciona una columna...</option>');
                    columnas.forEach(col => select.append(`<option value="${col}">${col}</option>`));
                    mostrarPaso('paso2-columna');
                    mostrarLoading(false);
                })
                .withFailureHandler(err => { alert(err); mostrarLoading(false); })
                .obtenerColumnasDeHoja(nombreHoja);
        }

        function seleccionarColumna() {
            const columna = $('#columna-select').val();
            if (!columna) {
                alert('Por favor, selecciona una columna.'); return;
            }
            filtro.columna = columna;
            mostrarLoading(true);
            google.script.run
                .withSuccessHandler(valores => {
                    $('#valores-select').empty().select2({
                        data: valores,
                        placeholder: 'Selecciona uno o más valores...'
                    });
                    mostrarPaso('paso3-valores');
                    mostrarLoading(false);
                })
                .withFailureHandler(err => { alert(err); mostrarLoading(false); })
                .obtenerValoresUnicosDeColumna(filtro.hoja, filtro.columna);
        }

        function aplicarFiltro() {
            const valores = $('#valores-select').val();
            if (!valores || valores.length === 0) {
                alert('Por favor, selecciona al menos un valor para filtrar.'); return;
            }
            filtro.valores = valores;
            mostrarLoading(true);

            // --- LÓGICA SIMPLIFICADA ---
            // Llama a la función del servidor. Cuando termina, el servidor abre la nueva ventana
            // y el withSuccessHandler simplemente cierra esta.
            google.script.run
                .withSuccessHandler(() => google.script.host.close())
                .withFailureHandler(err => { alert(err); mostrarLoading(false); })
                .aplicarFiltroDinamico(filtro);
        }

        function mostrarPaso(idPaso) {
            $('.paso').hide();
            $(`#${idPaso}`).show();
        }

        function mostrarLoading(mostrar) {
            $('#loading').toggle(mostrar);
        }
    </script>
</body>
</html>
