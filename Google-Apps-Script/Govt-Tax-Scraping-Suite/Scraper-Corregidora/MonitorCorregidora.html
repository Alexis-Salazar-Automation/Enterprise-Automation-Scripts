<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body { font-family: 'Segoe UI', sans-serif; background-color: #f7f7f7; color: #333; padding: 20px; margin: 0; box-sizing: border-box; }
    .card { background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border: 1px solid #ddd; }
    h2 { margin-top: 0; text-align: center; color: #d9534f; font-weight: 500; font-size: 1.4em; border-bottom: 1px solid #eee; padding-bottom: 15px; margin-bottom: 20px; }
    
    #statusText { font-size: 1.1em; margin-bottom: 10px; text-align: center; color: #f0ad4e; min-height: 20px; font-weight: bold;}
    
    .progress-container { width: 100%; background: #e9ecef; border-radius: 25px; margin-bottom: 10px; }
    #progressBar { width: 0%; height: 20px; background-color: #5cb85c; border-radius: 25px; transition: width 0.4s ease-in-out; text-align: center; color: #fff; font-weight: bold; line-height: 20px; font-size: 12px;}
    #progressText { text-align: center; font-family: monospace; font-size: 1em; color: #5bc0de; margin-bottom: 20px; }

    #log-console { background-color: #222; border: 1px solid #444; border-radius: 8px; height: 160px; overflow-y: auto; padding: 10px; font-family: 'Courier New', Courier, monospace; font-size: 12px; color: #f8f8f2; white-space: pre-wrap; }
    .log-item { padding: 2px 0; border-bottom: 1px solid #383838; }
    .log-success { color: #5cb85c; }
    .log-error { color: #d9534f; font-weight: bold;}
    .log-info { color: #5bc0de; }
    .log-warning { color: #f0ad4e; }
    
    .botones-container { display: flex; gap: 10px; margin-top: 20px; }
    button { flex: 1; padding: 15px; font-size: 1.1em; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }
    button:disabled { background-color: #ccc !important; cursor: not-allowed !important; color: #888 !important; transform: none !important;}
    
    #btnStart { background-color: #337ab7; color: #fff; }
    #btnStart:hover:not(:disabled) { background-color: #286090; transform: translateY(-2px); }
    
    #btnStop { background-color: #d9534f; color: #ffffff; display: none; }
    #btnStop:hover:not(:disabled) { background-color: #c9302c; transform: translateY(-2px); }
  </style>
</head>
<body>
  <div class="card">
    <h2>📡 Terminal de Consulta - Corregidora</h2>
    <div id="statusText">Listo para procesar.</div>
    
    <div class="progress-container">
      <div id="progressBar"></div>
    </div>
    <div id="progressText">0 / 0 | 0%</div>
    
    <div id="log-console"></div>

    <div class="botones-container">
      <button id="btnStart" onclick="iniciarProceso()">▶ Iniciar Consulta</button>
      <button id="btnStop" onclick="detenerProceso()">⏹ Detener Seguro</button>
    </div>
  </div>

<script>
    let detenerSolicitado = false;

    // NUEVA VERSIÓN: Con Timeout estricto para evitar que el script se cuelgue
    function runGoogle(fnName, ...args) {
      return new Promise((resolve, reject) => {
        // Configuramos un temporizador de 25 segundos máximo por petición
        const tiempoMaximo = 25000; 
        
        const temporizador = setTimeout(() => {
          reject(new Error("TIMEOUT_LOCAL"));
        }, tiempoMaximo);

        google.script.run
          .withSuccessHandler((res) => {
            clearTimeout(temporizador);
            resolve(res);
          })
          .withFailureHandler((err) => {
            clearTimeout(temporizador);
            reject(err);
          })
          [fnName](...args);
      });
    }

    function logToConsole(message, type = 'info') {
        const consoleDiv = document.getElementById('log-console');
        const newItem = document.createElement('div');
        newItem.className = 'log-item log-' + type;
        newItem.textContent = `> ${message}`;
        consoleDiv.appendChild(newItem);
        consoleDiv.scrollTop = consoleDiv.scrollHeight; 
    }

    function detenerProceso() {
      detenerSolicitado = true;
      const btnStop = document.getElementById('btnStop');
      btnStop.disabled = true;
      btnStop.innerText = "⏳ Deteniendo...";
      logToConsole('Se solicitó detener. Esperando a que termine el registro actual...', 'warning');
    }

    async function iniciarProceso() {
      const btnStart = document.getElementById('btnStart');
      const btnStop = document.getElementById('btnStop');
      const statusText = document.getElementById('statusText');
      
      if (btnStart.disabled) return;
      
      detenerSolicitado = false;
      btnStart.disabled = true;
      btnStart.style.display = "none";
      btnStop.disabled = false;
      btnStop.innerText = "⏹ Detener Seguro";
      btnStop.style.display = "block";
      
      try {
        logToConsole('Configurando hoja de cálculo...', 'info');
        await runGoogle('configurarHojaCorregidora');

        logToConsole('Detectando registros pendientes...', 'info');
        const pendientes = await runGoogle('obtenerClavesParaProcesarCorregidora');
        
        if (pendientes.length === 0) {
          logToConsole('No hay claves nuevas para procesar.', 'success');
          statusText.innerText = "¡Todo está al día!";
          restaurarBotones("✔️ Finalizado");
          return;
        }
        
        const totalClaves = pendientes.length;
        logToConsole(`Se detectaron ${totalClaves} claves por procesar.`, 'warning');
        
        let chunk = []; 
        let procesoCompletado = true;
        
        for (let i = 0; i < totalClaves; i++) {
          if (detenerSolicitado) {
             logToConsole('🛑 Proceso interrumpido por el usuario.', 'warning');
             break; // Salimos del bucle
          }

          const item = pendientes[i];
          statusText.innerText = `Consultando: ${item.clave}`;
          
          let resultado;
          try {
            // Intentamos procesar con el límite de tiempo
            resultado = await runGoogle('procesarClaveCorregidora', item.clave);
          } catch (e) {
            // MANEJO DE ERRORES MEJORADO
            let msgError = e ? e.message : "Error Desconocido (undefined)";
            
            if (msgError === "TIMEOUT_LOCAL") {
                logToConsole(`⚠️ ERROR: ${item.clave} -> Servidor colgado (Timeout). Protegiendo cuenta...`, 'error');
                // Pausamos 5 segundos para dejar respirar a Google y al Servidor
                await new Promise(r => setTimeout(r, 5000));
                resultado = { status: 'ERROR SCRIPT', mensaje: 'Timeout del servidor', datos: {}, conceptosDesglosados: {} };
            } else {
                logToConsole(`⚠️ ERROR CRÍTICO en ${item.clave}: ${msgError}`, 'error');
                // Si es un error de Google de saturación, cortamos por seguridad
                if(msgError.includes("undefined") || msgError.includes("excedió")) {
                    logToConsole('🛑 PAUSA OBLIGATORIA: Google limitó las peticiones. Intenta en 5 mins.', 'error');
                    procesoCompletado = false;
                    break;
                }
                resultado = { status: 'ERROR SCRIPT', mensaje: msgError, datos: {}, conceptosDesglosados: {} };
            }
          }
          
          const percent = Math.round(((i + 1) / totalClaves) * 100);
          document.getElementById('progressBar').style.width = percent + '%';
          document.getElementById('progressText').innerText = `${i + 1} / ${totalClaves} | ${percent}%`;
          
          if (resultado.status === 'OK') {
            logToConsole(`OK: ${item.clave} -> $${resultado.datos.adeudo.toFixed(2)}`, 'success');
          } else if (resultado.status !== 'ERROR SCRIPT') {
            logToConsole(`ERROR: ${item.clave} -> ${resultado.mensaje}`, 'warning');
          }
          
          const datos = resultado.datos || {};
          const conceptos = resultado.conceptosDesglosados || {};

          const valoresFila = [
            resultado.status, resultado.mensaje, datos.adeudo || 0,
            datos.inicial_periodo || "", datos.final_periodo || "", datos.nombre_completo || "",
            datos.rfc || "", datos.direccion_predio || "", datos.direccion_completa || "",
            conceptos["IMPUESTO"] || 0, conceptos["REZAGO_ACTUAL"] || 0, conceptos["REZAGO_ANTERIOR"] || 0,
            conceptos["RECARGOS"] || 0, conceptos["ACTUALIZACION"] || 0, conceptos["MULTAS"] || 0,
            conceptos["REDONDEO"] || 0, datos.valor_terreno || 0, datos.valor_construccion || 0
          ];
          
          chunk.push({ fila: item.fila, valores: valoresFila });

          // Guardamos cada 20 para ser más seguros ante caídas
          if (chunk.length >= 20 || i === totalClaves - 1 || !procesoCompletado || detenerSolicitado) {
            statusText.innerText = `💾 Guardando paquete de ${chunk.length} registros...`;
            try {
              await runGoogle('guardarChunkDiscontinuo', chunk);
              logToConsole(`💾 Se insertaron ${chunk.length} registros en la hoja.`, 'info');
              chunk = []; 
            } catch(errSave) {
              logToConsole(`ERROR AL GUARDAR: ${errSave.message}`, 'error');
            }
          }
        }
        
        if (procesoCompletado && !detenerSolicitado) {
          statusText.innerText = "¡Proceso terminado con éxito!";
          logToConsole("Todas las claves fueron procesadas.", "success");
        } else {
          statusText.innerText = "Proceso Pausado / Interrumpido.";
        }
        restaurarBotones(procesoCompletado && !detenerSolicitado ? "✔️ Finalizado" : "▶ Reanudar Consulta");

      } catch (error) {
        statusText.innerText = "Ocurrió un error general.";
        let errDesc = error ? error.message : "Fallo de conexión o límite de Google excedido.";
        logToConsole(`ERROR FATAL MAIN: ${errDesc}`, "error");
        restaurarBotones("▶ Reanudar Consulta");
      }
    }

    function restaurarBotones(textoStart) {
      const btnStart = document.getElementById('btnStart');
      const btnStop = document.getElementById('btnStop');
      
      btnStop.style.display = "none";
      btnStart.style.display = "block";
      btnStart.disabled = false;
      btnStart.innerText = textoStart;
    }
  </script>
</body>
</html>
